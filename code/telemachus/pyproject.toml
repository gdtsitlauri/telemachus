[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemachus-physical-ai"
version = "5.0.0"
description = "Source-aware, resource-bounded evidence acquisition for continuous robotic navigation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "torch>=2.5", "pillow>=10", "pandas>=2.0", "matplotlib>=3.8", "scikit-learn>=1.6"]

[project.optional-dependencies]
modern = ["transformers>=5.18,<6", "accelerate>=1.0", "sionna>=2.2,<3", "num2words>=0.5", "socksio>=1", "fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
telemachus = "telemachus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
